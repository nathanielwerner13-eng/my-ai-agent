<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Bina">
    <meta name="theme-color" content="#000000">
    <title>Bina</title>
    <link rel="manifest" href="/manifest.json">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif; overflow: hidden; }
        body { display: flex; flex-direction: column; height: 100dvh; }

        header {
            flex-shrink: 0;
            padding: env(safe-area-inset-top, 44px) 20px 14px;
            background: #000;
            border-bottom: 1px solid #0a0a0a;
            display: flex; align-items: center; justify-content: space-between;
        }
        .bina-name { font-size: 22px; font-weight: 200; letter-spacing: 12px; color: #fff; text-transform: uppercase; }
        .bina-sub { font-size: 8px; color: #1a6b4a; letter-spacing: 4px; margin-top: 2px; text-transform: uppercase; }
        .status-dot { width: 6px; height: 6px; background: #00ff88; border-radius: 50%; box-shadow: 0 0 8px #00ff88; animation: pulse 2s infinite; }
        @keyframes pulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 8px #00ff88; }
            50% { opacity: 0.5; box-shadow: 0 0 16px #00ff88; }
        }

        .page { flex: 1; display: none; flex-direction: column; overflow: hidden; }
        .page.active { display: flex; }

        #bottom-nav {
            flex-shrink: 0; display: flex;
            border-top: 1px solid #0a0a0a; background: #000;
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }
        .nav-btn {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 10px 0; cursor: pointer;
            background: none; border: none; color: #333;
            font-family: inherit; transition: color 0.2s; position: relative;
        }
        .nav-btn.active { color: #00ff88; }
        .nav-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.5; margin-bottom: 4px; }
        .nav-label { font-size: 9px; letter-spacing: 2px; text-transform: uppercase; }
        .nav-badge {
            position: absolute; top: 6px; right: calc(50% - 16px);
            background: #00ff88; color: #000;
            font-size: 8px; font-weight: 700;
            border-radius: 50%; width: 14px; height: 14px;
            display: none; align-items: center; justify-content: center;
        }

        #chat { flex: 1; overflow-y: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 16px; -webkit-overflow-scrolling: touch; }
        #chat::-webkit-scrollbar { width: 0; }
        .msg { max-width: 78%; display: flex; flex-direction: column; }
        .msg.user { align-self: flex-end; }
        .msg.agent { align-self: flex-start; }
        .msg-bubble { padding: 12px 16px; font-size: 15px; line-height: 1.6; border-radius: 18px; }
        .msg.user .msg-bubble { background: #111; border: 1px solid #1f1f1f; color: #e8e8e8; border-radius: 18px 18px 4px 18px; }
        .msg.agent .msg-bubble { background: linear-gradient(135deg, #050f0a 0%, #000 100%); border: 1px solid #0d2a1a; color: #b8d4c4; border-radius: 4px 18px 18px 18px; }
        .msg-label { font-size: 8px; letter-spacing: 3px; color: #1a6b4a; margin-bottom: 5px; text-transform: uppercase; }
        .msg.user .msg-label { display: none; }
        .msg.typing .msg-bubble { display: flex; gap: 5px; align-items: center; padding: 14px 20px; }
        .dot { width: 5px; height: 5px; background: #00ff88; border-radius: 50%; animation: typing 1.2s infinite; opacity: 0.3; }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing { 0%, 100% { opacity: 0.3; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-3px); } }
        .status-tag { font-size: 11px; padding: 5px 12px; border-radius: 20px; align-self: flex-start; margin-top: -8px; }
        .status-tag.sent { color: #00ff88; background: #001a0d; border: 1px solid #004d1f; }
        .status-tag.failed { color: #ff4444; background: #1a0000; border: 1px solid #4d0000; }
        .status-tag.event { color: #4488ff; background: #000d1a; border: 1px solid #003366; }

        #quick { flex-shrink: 0; padding: 10px 16px; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; border-top: 1px solid #080808; }
        #quick::-webkit-scrollbar { display: none; }
        .qa { background: #070707; border: 1px solid #141414; color: #555; font-size: 11px; padding: 7px 16px; border-radius: 20px; white-space: nowrap; cursor: pointer; flex-shrink: 0; font-family: inherit; letter-spacing: 1px; transition: all 0.2s; }
        .qa:active { background: #111; color: #00ff88; border-color: #0d2a1a; }

        #chat-input-area { flex-shrink: 0; padding: 12px 16px; border-top: 1px solid #080808; display: flex; gap: 10px; align-items: flex-end; background: #000; }
        #mic { width: 40px; height: 40px; flex-shrink: 0; background: #070707; border: 1px solid #141414; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        #mic.listening { border-color: #00ff88; background: #001a0d; }
        #mic svg { width: 16px; height: 16px; stroke: #444; fill: none; stroke-width: 1.5; }
        #mic.listening svg { stroke: #00ff88; }
        #input { flex: 1; background: #070707; border: 1px solid #141414; color: #e8e8e8; padding: 11px 16px; font-size: 15px; outline: none; font-family: inherit; border-radius: 22px; resize: none; max-height: 120px; line-height: 1.5; }
        #input:focus { border-color: #0d2a1a; }
        #input::placeholder { color: #2a2a2a; }
        #send { width: 40px; height: 40px; flex-shrink: 0; background: #00ff88; color: #000; border: none; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        #send:active { background: #00cc6a; transform: scale(0.95); }
        #send svg { width: 16px; height: 16px; stroke: #000; fill: none; stroke-width: 2.5; }

        .feed-header, .inbox-header { flex-shrink: 0; padding: 20px 20px 14px; border-bottom: 1px solid #0a0a0a; }
        .feed-title, .inbox-title { font-size: 11px; letter-spacing: 6px; color: #00ff88; text-transform: uppercase; }
        .feed-sub, .inbox-sub { font-size: 11px; color: #333; margin-top: 4px; letter-spacing: 1px; }

        .feed-list, .inbox-list { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .feed-list::-webkit-scrollbar, .inbox-list::-webkit-scrollbar { width: 0; }

        .feed-item {
            background: #050f0a; border: 1px solid #0d1a12;
            border-left: 2px solid #0d2a1a;
            padding: 18px; border-radius: 12px; transition: all 0.2s;
        }
        .feed-item.unread { border-left-color: #00ff88; }
        .feed-item-type { font-size: 9px; color: #1a6b4a; letter-spacing: 3px; margin-bottom: 8px; text-transform: uppercase; }
        .feed-item-title { font-size: 15px; color: #ccc; margin-bottom: 12px; font-weight: 400; line-height: 1.4; }
        .feed-item-body { font-size: 13px; color: #666; line-height: 1.8; }
        .feed-item-body .section-title { font-size: 10px; color: #00ff88; letter-spacing: 3px; text-transform: uppercase; margin: 16px 0 8px; display: block; }
        .feed-item-body .highlight { color: #e8e8e8; font-weight: 500; }
        .feed-item-body .bullet { padding: 5px 0 5px 12px; border-left: 1px solid #0d2a1a; color: #777; margin: 4px 0; display: block; }
        .feed-item-body .divider { border-top: 1px solid #0a0a0a; margin: 14px 0; display: block; }
        .feed-item-body .opportunity { background: #000; border: 1px solid #0d2a1a; border-radius: 8px; padding: 12px; margin: 8px 0; display: block; }
        .feed-item-body .confidence-high { color: #00ff88; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; }
        .feed-item-body .confidence-med { color: #ffaa00; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; }
        .feed-item-body .confidence-low { color: #ff4444; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; }
        .feed-item-time { font-size: 10px; color: #222; margin-top: 14px; letter-spacing: 1px; }
        .feed-empty, .inbox-empty { color: #1a1a1a; text-align: center; margin-top: 80px; font-size: 12px; letter-spacing: 3px; text-transform: uppercase; }
        .feed-dismiss { background: none; border: none; color: #1a1a1a; font-size: 11px; cursor: pointer; font-family: inherit; margin-top: 12px; padding: 0; letter-spacing: 1px; display: block; }
        .feed-dismiss:active { color: #ff4444; }

        .inbox-item { background: #05080f; border: 1px solid #0d1220; border-left: 2px solid #0d1a2a; padding: 16px; border-radius: 12px; }
        .inbox-item.unread { border-left-color: #4488ff; }
        .inbox-from { font-size: 10px; color: #2a4a6b; letter-spacing: 2px; margin-bottom: 4px; text-transform: uppercase; }
        .inbox-subject { font-size: 14px; color: #ccc; margin-bottom: 8px; font-weight: 400; }
        .inbox-body { font-size: 12px; color: #444; margin-bottom: 14px; line-height: 1.6; }
        .inbox-draft-label { font-size: 9px; color: #2a4a6b; letter-spacing: 3px; margin-bottom: 8px; text-transform: uppercase; }
        .inbox-draft { background: #000; border: 1px solid #0d1a2a; padding: 12px; border-radius: 8px; font-size: 13px; color: #4488ff; line-height: 1.6; margin-bottom: 12px; }
        .inbox-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
        .btn-send { background: #4488ff; color: #000; border: none; padding: 8px 18px; font-size: 11px; border-radius: 20px; cursor: pointer; font-family: inherit; letter-spacing: 1px; font-weight: 600; }
        .btn-edit { background: #070707; color: #555; border: 1px solid #141414; padding: 8px 18px; font-size: 11px; border-radius: 20px; cursor: pointer; font-family: inherit; }
        .btn-dismiss-email { background: none; color: #222; border: none; padding: 8px 14px; font-size: 11px; cursor: pointer; font-family: inherit; }
        .btn-dismiss-email:active { color: #ff4444; }

        #notif-prompt { position: fixed; bottom: 60px; left: 0; right: 0; background: #050f0a; border-top: 1px solid #0d2a1a; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; z-index: 90; }
        #notif-prompt.hidden { display: none; }
        .notif-prompt-text { font-size: 12px; color: #1a6b4a; letter-spacing: 1px; }
        .notif-prompt-btn { background: #00ff88; color: #000; border: none; padding: 8px 20px; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; font-family: inherit; border-radius: 20px; font-weight: 600; }
        .notif-prompt-dismiss { background: none; border: none; color: #222; font-size: 18px; cursor: pointer; }
    </style>
</head>
<body>

<div id="notif-prompt" class="hidden">
    <span class="notif-prompt-text">🔔 Enable Bina alerts</span>
    <button class="notif-prompt-btn" onclick="enablePush()">Enable</button>
    <button class="notif-prompt-dismiss" onclick="dismissPrompt()">✕</button>
</div>

<header>
    <div>
        <div class="bina-name">Bina</div>
        <div class="bina-sub">Always working. Never sleeping.</div>
    </div>
    <div class="status-dot"></div>
</header>

<!-- CHAT PAGE -->
<div id="page-chat" class="page active">
    <div id="chat">
        <div class="msg agent">
            <div class="msg-label">Bina</div>
            <div class="msg-bubble">Shalom, Nathaniel. Systems online. How can I assist you?</div>
        </div>
    </div>
    <div id="quick">
        <button class="qa" onclick="quickSend('Send an email')">Email</button>
        <button class="qa" onclick="quickSend('Search the web for ')">Search</button>
        <button class="qa" onclick="quickSend('What is on my schedule today?')">Schedule</button>
        <button class="qa" onclick="quickSend('Give me a business idea I can act on today')">Ideas</button>
        <button class="qa" onclick="quickSend('What should I be focused on right now?')">Focus</button>
        <button class="qa" onclick="quickSend('What are the live crypto prices?')">Crypto</button>
        <button class="qa" onclick="quickSend('What are the best Polymarket opportunities right now?')">Polymarket</button>
        <button class="qa" onclick="quickSend('What do you remember about me?')">Memory</button>
    </div>
    <div id="chat-input-area">
        <button id="mic" onclick="toggleMic()">
            <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="9" y1="22" x2="15" y2="22"/></svg>
        </button>
        <textarea id="input" placeholder="Message Bina..." rows="1" oninput="autoResize(this)"></textarea>
        <button id="send" onclick="send()">
            <svg viewBox="0 0 24 24"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
        </button>
    </div>
</div>

<!-- INTELLIGENCE FEED PAGE -->
<div id="page-feed" class="page">
    <div class="feed-header">
        <div class="feed-title">Intelligence Feed</div>
        <div class="feed-sub">Overnight research · Briefings · Market intelligence</div>
    </div>
    <div class="feed-list" id="feed-list"></div>
</div>

<!-- INBOX PAGE -->
<div id="page-inbox" class="page">
    <div class="inbox-header">
        <div class="inbox-title">Inbox</div>
        <div class="inbox-sub">Emails awaiting your review</div>
    </div>
    <div class="inbox-list" id="inbox-list"></div>
</div>


<!-- CLIPS PAGE -->
<div id="page-clips" class="page" style="display:none; flex-direction:column; height:100%; overflow:hidden;">
    <div style="padding:16px 20px 8px; border-bottom:1px solid #111;">
        <div style="font-size:11px; color:#666; text-transform:uppercase; letter-spacing:0.08em;">Clip Farm</div>
        <div style="font-size:13px; color:#888; margin-top:2px;">Top clips ready to download & post</div>
    </div>
    <div id="clips-list" style="flex:1; overflow-y:auto; padding:12px 16px; display:flex; flex-direction:column; gap:12px;">
        <div style="color:#444; font-size:13px; text-align:center; margin-top:40px;">Loading clips...</div>
    </div>
</div>

<!-- BOTTOM NAV -->
<div id="bottom-nav">
    <button class="nav-btn active" id="nav-chat" onclick="switchPage('chat')">
        <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span class="nav-label">Chat</span>
    </button>
    <button class="nav-btn" id="nav-feed" onclick="switchPage('feed')">
        <svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        <span class="nav-label">Intel</span>
        <span class="nav-badge" id="feed-badge"></span>
    </button>
    <button class="nav-btn" id="nav-inbox" onclick="switchPage('inbox')">
        <svg viewBox="0 0 24 24"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
        <span class="nav-label">Inbox</span>
        <span class="nav-badge" id="inbox-badge"></span>
    </button>
</div>

<script>
    // ── Page Navigation ────────────────────────────────────────────────────

    function switchPage(page) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('page-' + page).classList.add('active');
        document.getElementById('nav-' + page).classList.add('active');
        if (page === 'feed') renderFeed();
        if (page === 'inbox') renderInbox();
    }

    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('open') === 'feed') setTimeout(() => switchPage('feed'), 300);
    else if (urlParams.get('open') === 'inbox') setTimeout(() => switchPage('inbox'), 300);

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.addEventListener('message', function(e) {
            if (e.data && e.data.action === 'openFeed') switchPage('feed');
            if (e.data && e.data.action === 'openInbox') switchPage('inbox');
        });
    }

    // ── Push ───────────────────────────────────────────────────────────────

    startApp();

    function startApp() {
        startPolling();
        checkPushStatus();
    }

    async function checkPushStatus() {
        if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
        const permission = Notification.permission;
        if (permission === 'granted') await registerPushSilent();
        else if (permission === 'default') document.getElementById('notif-prompt').classList.remove('hidden');
    }

    async function enablePush() {
        document.getElementById('notif-prompt').classList.add('hidden');
        const permission = await Notification.requestPermission();
        if (permission === 'granted') await registerPushSilent();
    }

    function dismissPrompt() { document.getElementById('notif-prompt').classList.add('hidden'); }

    async function registerPushSilent() {
        try {
            const reg = await navigator.serviceWorker.register('/sw.js');
            await navigator.serviceWorker.ready;
            const keyRes = await fetch('/vapid-public-key');
            const keyData = await keyRes.json();
            let sub = await reg.pushManager.getSubscription();
            if (!sub) {
                sub = await reg.pushManager.subscribe({
                    userVisibleOnly: true,
                    applicationServerKey: urlBase64ToUint8Array(keyData.key)
                });
            }
            await fetch('/subscribe', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                credentials: 'include',
                body: JSON.stringify(sub)
            });
        } catch(e) { console.log('Push error:', e.message); }
    }

    function urlBase64ToUint8Array(base64String) {
        const padding = '='.repeat((4 - base64String.length % 4) % 4);
        const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
        const rawData = window.atob(base64);
        const outputArray = new Uint8Array(rawData.length);
        for (let i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
        return outputArray;
    }

    // ── Polling ────────────────────────────────────────────────────────────

    let allNotifications = [];
    let dismissedIds = new Set(JSON.parse(localStorage.getItem('dismissed') || '[]'));

    function startPolling() {
        pollNotifications();
        setInterval(pollNotifications, 30000);
    }

    async function pollNotifications() {
        try {
            const r = await fetch('/notifications', {credentials: 'include'});
            const d = await r.json();
            allNotifications = d.notifications.filter(n => !dismissedIds.has(n.id));
            const feedItems = allNotifications.filter(n => n.type !== 'email');
            const inboxItems = allNotifications.filter(n => n.type === 'email');
            const feedUnread = feedItems.filter(n => !n.read).length;
            const inboxUnread = inboxItems.filter(n => !n.read).length;
            const fb = document.getElementById('feed-badge');
            const ib = document.getElementById('inbox-badge');
            if (feedUnread > 0) { fb.textContent = feedUnread; fb.style.display = 'flex'; } else fb.style.display = 'none';
            if (inboxUnread > 0) { ib.textContent = inboxUnread; ib.style.display = 'flex'; } else ib.style.display = 'none';
        } catch(e) {}
    }

    function dismissLocally(id) {
        dismissedIds.add(id);
        localStorage.setItem('dismissed', JSON.stringify([...dismissedIds]));
        markRead(id);
    }

    async function markRead(id) {
        await fetch(`/notifications/read/${id}`, {method: 'POST', credentials: 'include'});
    }

    // ── Format Body ────────────────────────────────────────────────────────

    function formatBody(text) {
        if (!text) return '';
        return text
            .replace(/^### (.+)$/gm, '<span class="section-title">$1</span>')
            .replace(/^## (.+)$/gm, '<span class="section-title">$1</span>')
            .replace(/^# (.+)$/gm, '<span class="section-title">$1</span>')
            .replace(/\*\*(.+?)\*\*/g, '<span class="highlight">$1</span>')
            .replace(/^---$/gm, '<span class="divider"></span>')
            .replace(/^- (.+)$/gm, '<span class="bullet">$1</span>')
            .replace(/\*(.+?)\*/g, '<em style="color:#999;">$1</em>')
            .replace(/HIGH/g, '<span class="confidence-high">HIGH</span>')
            .replace(/MEDIUM-HIGH/g, '<span class="confidence-high">MEDIUM-HIGH</span>')
            .replace(/MEDIUM/g, '<span class="confidence-med">MEDIUM</span>')
            .replace(/LOW/g, '<span class="confidence-low">LOW</span>')
            .replace(/\n/g, '<br>');
    }

    // ── Intelligence Feed ──────────────────────────────────────────────────

    function renderFeed() {
        const list = document.getElementById('feed-list');
        const feedItems = allNotifications.filter(n => n.type !== 'email');
        if (feedItems.length === 0) {
            list.innerHTML = '<div class="feed-empty">No intelligence yet</div>';
            return;
        }
        list.innerHTML = feedItems.map(n => {
            const date = n.timestamp ? new Date(n.timestamp * 1000).toLocaleString('en-US', {
                month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'
            }) : '';
            return `
            <div class="feed-item ${n.read ? '' : 'unread'}" id="feed-${n.id}">
                <div class="feed-item-type">${n.from || 'Bina'}</div>
                <div class="feed-item-title">${n.subject}</div>
                <div class="feed-item-body">${formatBody(n.body)}</div>
                <div class="feed-item-time">${date}</div>
                <button class="feed-dismiss" onclick="dismissFeedItem('${n.id}')">Dismiss</button>
            </div>`;
        }).join('');
        feedItems.forEach(n => { if (!n.read) markRead(n.id); });
    }

    function dismissFeedItem(id) {
        dismissLocally(id);
        const el = document.getElementById('feed-' + id);
        if (el) {
            el.style.opacity = '0';
            el.style.transform = 'translateX(20px)';
            el.style.transition = 'all 0.3s';
            setTimeout(() => { el.remove(); pollNotifications(); }, 300);
        }
    }

    // ── Inbox ──────────────────────────────────────────────────────────────

    function renderInbox() {
        const list = document.getElementById('inbox-list');
        const inboxItems = allNotifications.filter(n => n.type === 'email');
        if (inboxItems.length === 0) {
            list.innerHTML = '<div class="inbox-empty">Inbox clear</div>';
            return;
        }
        list.innerHTML = inboxItems.map(n => `
            <div class="inbox-item ${n.read ? '' : 'unread'}" id="inbox-${n.id}">
                <div class="inbox-from">${n.from}</div>
                <div class="inbox-subject">${n.subject}</div>
                <div class="inbox-body">${n.body}</div>
                ${n.draft_reply ? `
                <div class="inbox-draft-label">Bina's Draft Reply</div>
                <div class="inbox-draft" id="draft-${n.id}" contenteditable="false">${n.draft_reply}</div>
                <div class="inbox-actions">
                    <button class="btn-send" onclick="sendDraft('${n.id}', '${escapeAttr(n.from)}', '${escapeAttr(n.subject)}')">Send Reply</button>
                    <button class="btn-edit" onclick="editDraft('${n.id}')">Edit</button>
                    <button class="btn-dismiss-email" onclick="dismissInboxItem('${n.id}')">Dismiss</button>
                </div>` : `
                <div class="inbox-actions">
                    <button class="btn-dismiss-email" onclick="dismissInboxItem('${n.id}')">Dismiss</button>
                </div>`}
            </div>
        `).join('');
        inboxItems.forEach(n => { if (!n.read) markRead(n.id); });
    }

    function dismissInboxItem(id) {
        dismissLocally(id);
        const el = document.getElementById('inbox-' + id);
        if (el) {
            el.style.opacity = '0';
            el.style.transform = 'translateX(20px)';
            el.style.transition = 'all 0.3s';
            setTimeout(() => { el.remove(); pollNotifications(); }, 300);
        }
    }

    function escapeAttr(str) {
        return (str || '').replace(/'/g, "\\'").replace(/"/g, '&quot;').replace(/\n/g, ' ');
    }

    async function sendDraft(id, from, subject) {
        const draftEl = document.getElementById(`draft-${id}`);
        const body = draftEl.innerText;
        const toMatch = from.match(/<(.+)>/) || [null, from];
        const to = toMatch[1];
        const r = await fetch('/send-draft', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            credentials: 'include',
            body: JSON.stringify({to, subject, body})
        });
        const d = await r.json();
        if (d.success) dismissInboxItem(id);
    }

    function editDraft(id) {
        const el = document.getElementById(`draft-${id}`);
        el.contentEditable = 'true';
        el.style.outline = '1px solid #4488ff';
        el.focus();
    }

    // ── Chat ───────────────────────────────────────────────────────────────

    function autoResize(el) {
        el.style.height = 'auto';
        el.style.height = Math.min(el.scrollHeight, 120) + 'px';
    }

    document.getElementById('input').addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    });

    function quickSend(text) {
        document.getElementById('input').value = text;
        if (!text.endsWith(' ')) send();
        else document.getElementById('input').focus();
    }

    function addMsg(text, role) {
        const chat = document.getElementById('chat');
        const div = document.createElement('div');
        div.className = 'msg ' + role;
        if (role === 'agent') {
            div.innerHTML = `<div class="msg-label">Bina</div><div class="msg-bubble">${formatBody(text)}</div>`;
        } else if (role === 'typing') {
            div.className = 'msg agent typing';
            div.innerHTML = `<div class="msg-label">Bina</div><div class="msg-bubble"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
        } else {
            div.innerHTML = `<div class="msg-bubble">${text.replace(/\n/g, '<br>')}</div>`;
        }
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
        return div;
    }

    function addStatus(text, type) {
        const chat = document.getElementById('chat');
        const div = document.createElement('div');
        div.className = 'status-tag ' + type;
        div.textContent = text;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }

    let history = [];

    async function send() {
        const input = document.getElementById('input');
        const msg = input.value.trim();
        if (!msg) return;
        input.value = '';
        input.style.height = 'auto';
        addMsg(msg, 'user');
        const typing = addMsg('', 'typing');
        try {
            const r = await fetch('/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                credentials: 'include',
                body: JSON.stringify({message: msg, history: history})
            });
            const d = await r.json();
            typing.className = 'msg agent';
            typing.innerHTML = `<div class="msg-label">Bina</div><div class="msg-bubble">${formatBody(d.response)}</div>`;
            if (d.email_sent) addStatus(d.email_sent, 'sent');
            if (d.email_error) addStatus(d.email_error, 'failed');
            if (d.event_created) addStatus(d.event_created, 'event');
            history.push({role: 'user', content: msg});
            history.push({role: 'assistant', content: d.response});
            if (history.length > 20) history = history.slice(-20);
        } catch(e) {
            typing.className = 'msg agent';
            typing.innerHTML = `<div class="msg-label">Bina</div><div class="msg-bubble">Connection error. Try again.</div>`;
        }
        document.getElementById('chat').scrollTop = 99999;
    }


    // ── Clips ──────────────────────────────────────────────────────────────

    async function loadClips() {
        try {
            const r = await fetch('/feed');
            const d = await r.json();
            const clips = (d.notifications || []).filter(n => n.type === 'clip' || (n.title && n.title.toLowerCase().includes('clip')));
            const list = document.getElementById('clips-list');
            if (!clips.length) {
                list.innerHTML = '<div style="color:#444; font-size:13px; text-align:center; margin-top:40px;">No clips yet — clipper runs every 30 min.</div>';
                return;
            }
            list.innerHTML = clips.map(c => `
                <div style="background:#0a0a0a; border:1px solid #1a1a1a; border-radius:12px; padding:14px;">
                    <div style="font-size:12px; color:#666; margin-bottom:6px;">${c.source || 'Clip'} · ${c.time || ''}</div>
                    <div style="font-size:14px; color:#fff; font-weight:500; margin-bottom:8px;">${c.title || 'Untitled clip'}</div>
                    <div style="font-size:12px; color:#888; margin-bottom:10px;">${c.body || ''}</div>
                    ${c.url ? `<a href="${c.url}" target="_blank" style="display:inline-block; background:#4488ff; color:#fff; font-size:12px; font-weight:600; padding:7px 14px; border-radius:8px; text-decoration:none;">⬇ Download</a>` : ''}
                    ${c.caption ? `<div style="margin-top:8px; font-size:11px; color:#555;">Caption: ${c.caption}</div>` : ''}
                </div>
            `).join('');
        } catch(e) {
            document.getElementById('clips-list').innerHTML = '<div style="color:#444; font-size:13px; text-align:center; margin-top:40px;">Could not load clips.</div>';
        }
    }

    // patch switchPage to load clips when tab opened
    const _origSwitchPage = switchPage;
    switchPage = function(page) {
        _origSwitchPage(page);
        if (page === 'clips') loadClips();
    };

    // ── Voice ──────────────────────────────────────────────────────────────

    let recognition = null;
    function toggleMic() {
        const mic = document.getElementById('mic');
        if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) return;
        if (recognition) { recognition.stop(); recognition = null; mic.classList.remove('listening'); return; }
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SR();
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.lang = 'en-US';
        recognition.onresult = e => {
            document.getElementById('input').value = e.results[0][0].transcript;
            mic.classList.remove('listening');
            recognition = null;
            send();
        };
        recognition.onerror = () => { mic.classList.remove('listening'); recognition = null; };
        recognition.onend = () => { mic.classList.remove('listening'); recognition = null; };
        recognition.start();
        mic.classList.add('listening');
    }
</script>
</body>
