<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Bina">
    <meta name="theme-color" content="#000000">
    <title>Bina</title>
    <link rel="manifest" href="/manifest.json">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif; overflow: hidden; }
        body { display: flex; flex-direction: column; height: 100dvh; }

        /* ── HEADER ── */
        header {
            flex-shrink: 0;
            padding: env(safe-area-inset-top, 44px) 20px 14px;
            background: #000;
            border-bottom: 1px solid #0a0a0a;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
        }
        .header-left { display: flex; flex-direction: column; }
        .bina-name {
            font-size: 22px;
            font-weight: 200;
            letter-spacing: 12px;
            color: #fff;
            text-transform: uppercase;
        }
        .bina-sub {
            font-size: 8px;
            color: #1a6b4a;
            letter-spacing: 4px;
            margin-top: 2px;
            text-transform: uppercase;
        }
        .header-right { display: flex; align-items: center; gap: 16px; }
        .status-dot {
            width: 6px; height: 6px;
            background: #00ff88;
            border-radius: 50%;
            box-shadow: 0 0 8px #00ff88;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 8px #00ff88; }
            50% { opacity: 0.5; box-shadow: 0 0 16px #00ff88; }
        }
        #notif-btn {
            background: none; border: none; cursor: pointer;
            position: relative; padding: 4px;
            display: flex; align-items: center; justify-content: center;
        }
        .bell-icon {
            width: 22px; height: 22px;
            stroke: #444; fill: none;
            stroke-width: 1.5;
            transition: stroke 0.2s;
        }
        #notif-btn.has-unread .bell-icon { stroke: #00ff88; }
        #notif-badge {
            position: absolute; top: 0; right: 0;
            background: #00ff88; color: #000;
            font-size: 8px; font-weight: 700;
            border-radius: 50%; width: 14px; height: 14px;
            display: none; align-items: center; justify-content: center;
        }

        /* ── CHAT ── */
        #chat {
            flex: 1; overflow-y: auto;
            padding: 20px 16px;
            display: flex; flex-direction: column; gap: 16px;
            -webkit-overflow-scrolling: touch;
        }
        #chat::-webkit-scrollbar { width: 0; }

        .msg { max-width: 78%; display: flex; flex-direction: column; }
        .msg.user { align-self: flex-end; }
        .msg.agent { align-self: flex-start; }

        .msg-bubble {
            padding: 12px 16px;
            font-size: 15px;
            line-height: 1.6;
            border-radius: 18px;
        }
        .msg.user .msg-bubble {
            background: #111;
            border: 1px solid #1f1f1f;
            color: #e8e8e8;
            border-radius: 18px 18px 4px 18px;
        }
        .msg.agent .msg-bubble {
            background: linear-gradient(135deg, #050f0a 0%, #000 100%);
            border: 1px solid #0d2a1a;
            color: #b8d4c4;
            border-radius: 4px 18px 18px 18px;
            position: relative;
        }
        .msg.agent .msg-bubble::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 4px 18px 18px 18px;
            background: linear-gradient(135deg, rgba(0,255,136,0.03) 0%, transparent 100%);
            pointer-events: none;
        }
        .msg-label {
            font-size: 8px;
            letter-spacing: 3px;
            color: #1a6b4a;
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        .msg.user .msg-label { display: none; }

        .msg.typing .msg-bubble {
            display: flex; gap: 5px; align-items: center;
            padding: 14px 20px;
        }
        .dot {
            width: 5px; height: 5px;
            background: #00ff88;
            border-radius: 50%;
            animation: typing 1.2s infinite;
            opacity: 0.3;
        }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing {
            0%, 100% { opacity: 0.3; transform: translateY(0); }
            50% { opacity: 1; transform: translateY(-3px); }
        }

        .status-tag {
            font-size: 11px; padding: 5px 12px;
            border-radius: 20px; align-self: flex-start;
            margin-top: -8px;
        }
        .status-tag.sent { color: #00ff88; background: #001a0d; border: 1px solid #004d1f; }
        .status-tag.failed { color: #ff4444; background: #1a0000; border: 1px solid #4d0000; }
        .status-tag.event { color: #4488ff; background: #000d1a; border: 1px solid #003366; }

        /* ── QUICK ACTIONS ── */
        #quick {
            flex-shrink: 0;
            padding: 10px 16px;
            display: flex; gap: 8px; overflow-x: auto;
            scrollbar-width: none;
            border-top: 1px solid #080808;
        }
        #quick::-webkit-scrollbar { display: none; }
        .qa {
            background: #070707;
            border: 1px solid #141414;
            color: #555;
            font-size: 11px; padding: 7px 16px;
            border-radius: 20px; white-space: nowrap;
            cursor: pointer; flex-shrink: 0;
            font-family: inherit;
            letter-spacing: 1px;
            transition: all 0.2s;
        }
        .qa:active { background: #111; color: #00ff88; border-color: #0d2a1a; }

        /* ── INPUT ── */
        #bottom {
            flex-shrink: 0;
            padding: 12px 16px;
            padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
            border-top: 1px solid #080808;
            display: flex; gap: 10px; align-items: flex-end;
            background: #000;
        }
        #mic {
            width: 40px; height: 40px; flex-shrink: 0;
            background: #070707; border: 1px solid #141414;
            border-radius: 50%; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
        }
        #mic.listening { border-color: #00ff88; background: #001a0d; }
        #mic svg { width: 16px; height: 16px; stroke: #444; fill: none; stroke-width: 1.5; }
        #mic.listening svg { stroke: #00ff88; }
        #input {
            flex: 1;
            background: #070707; border: 1px solid #141414;
            color: #e8e8e8; padding: 11px 16px;
            font-size: 15px; outline: none;
            font-family: inherit; border-radius: 22px;
            resize: none; max-height: 120px; line-height: 1.5;
            transition: border-color 0.2s;
        }
        #input:focus { border-color: #0d2a1a; }
        #input::placeholder { color: #2a2a2a; }
        #send {
            width: 40px; height: 40px; flex-shrink: 0;
            background: #00ff88; color: #000; border: none;
            border-radius: 50%; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
        }
        #send:active { background: #00cc6a; transform: scale(0.95); }
        #send svg { width: 16px; height: 16px; stroke: #000; fill: none; stroke-width: 2.5; }

        /* ── NOTIFICATIONS PANEL ── */
        #notif-panel {
            position: fixed; inset: 0; background: #000;
            z-index: 50; display: flex; flex-direction: column;
            transform: translateX(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #notif-panel.open { transform: translateX(0); }
        .notif-header {
            padding: env(safe-area-inset-top, 44px) 20px 16px;
            border-bottom: 1px solid #0a0a0a;
            display: flex; justify-content: space-between; align-items: center;
        }
        .notif-title {
            font-size: 13px; font-weight: 300;
            letter-spacing: 6px; color: #00ff88;
            text-transform: uppercase;
        }
        .notif-close {
            background: none; border: none; color: #333;
            font-size: 22px; cursor: pointer; padding: 4px;
        }
        #notif-list {
            flex: 1; overflow-y: auto; padding: 16px;
            display: flex; flex-direction: column; gap: 12px;
        }
        #notif-list::-webkit-scrollbar { width: 0; }
        .notif-item {
            background: #050f0a;
            border: 1px solid #0d1a12;
            border-left: 2px solid #0d2a1a;
            padding: 16px; border-radius: 12px;
            transition: border-left-color 0.2s;
        }
        .notif-item.unread { border-left-color: #00ff88; }
        .notif-from { font-size: 10px; color: #1a6b4a; letter-spacing: 2px; margin-bottom: 4px; text-transform: uppercase; }
        .notif-subject { font-size: 14px; color: #ccc; margin-bottom: 8px; font-weight: 400; }
        .notif-body { font-size: 12px; color: #444; margin-bottom: 14px; line-height: 1.6; }
        .notif-draft-label { font-size: 9px; color: #1a6b4a; letter-spacing: 3px; margin-bottom: 8px; text-transform: uppercase; }
        .notif-draft {
            background: #000; border: 1px solid #0d2a1a;
            padding: 12px; border-radius: 8px;
            font-size: 13px; color: #00ff88; line-height: 1.6;
            margin-bottom: 12px;
        }
        .notif-actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn-send {
            background: #00ff88; color: #000; border: none;
            padding: 8px 18px; font-size: 11px; border-radius: 20px;
            cursor: pointer; font-family: inherit; letter-spacing: 1px;
            font-weight: 600;
        }
        .btn-edit {
            background: #070707; color: #555; border: 1px solid #141414;
            padding: 8px 18px; font-size: 11px; border-radius: 20px;
            cursor: pointer; font-family: inherit;
        }
        .btn-dismiss {
            background: none; color: #2a2a2a; border: none;
            padding: 8px 14px; font-size: 11px; cursor: pointer; font-family: inherit;
        }
        .notif-empty {
            color: #1a1a1a; text-align: center;
            margin-top: 80px; font-size: 12px; letter-spacing: 3px;
            text-transform: uppercase;
        }

        /* ── ENABLE PUSH PROMPT ── */
        #notif-prompt {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: #050f0a; border-top: 1px solid #0d2a1a;
            padding: 14px 20px;
            padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
            display: flex; align-items: center; justify-content: space-between;
            z-index: 90;
        }
        #notif-prompt.hidden { display: none; }
        .notif-prompt-text { font-size: 12px; color: #1a6b4a; letter-spacing: 1px; }
        .notif-prompt-btn {
            background: #00ff88; color: #000; border: none;
            padding: 8px 20px; font-size: 11px; letter-spacing: 2px;
            text-transform: uppercase; cursor: pointer;
            font-family: inherit; border-radius: 20px; font-weight: 600;
        }
        .notif-prompt-dismiss {
            background: none; border: none; color: #222;
            font-size: 18px; cursor: pointer; padding: 4px 8px;
        }
    </style>
</head>
<body>

<div id="notif-prompt" class="hidden">
    <span class="notif-prompt-text">🔔 Enable Bina alerts</span>
    <button class="notif-prompt-btn" onclick="enablePush()">Enable</button>
    <button class="notif-prompt-dismiss" onclick="dismissPrompt()">✕</button>
</div>

<!-- NOTIFICATIONS PANEL -->
<div id="notif-panel">
    <div class="notif-header">
        <span class="notif-title">Intelligence Feed</span>
        <button class="notif-close" onclick="closeNotifs()">✕</button>
    </div>
    <div id="notif-list"></div>
</div>

<!-- HEADER -->
<header>
    <div class="header-left">
        <div class="bina-name">Bina</div>
        <div class="bina-sub">Always working. Never sleeping.</div>
    </div>
    <div class="header-right">
        <div class="status-dot"></div>
        <button id="notif-btn" onclick="openNotifs()">
            <svg class="bell-icon" viewBox="0 0 24 24">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
            </svg>
            <span id="notif-badge"></span>
        </button>
    </div>
</header>

<!-- CHAT -->
<div id="chat">
    <div class="msg agent">
        <div class="msg-label">Bina</div>
        <div class="msg-bubble">Shalom, Nathaniel. Systems online. How can I assist you?</div>
    </div>
</div>

<!-- QUICK ACTIONS -->
<div id="quick">
    <button class="qa" onclick="quickSend('Send an email')">Email</button>
    <button class="qa" onclick="quickSend('Search the web for ')">Search</button>
    <button class="qa" onclick="quickSend('What is on my schedule today?')">Schedule</button>
    <button class="qa" onclick="quickSend('Give me a business idea I can act on today')">Ideas</button>
    <button class="qa" onclick="quickSend('What should I be focused on right now?')">Focus</button>
    <button class="qa" onclick="quickSend('Latest crypto and market news')">Markets</button>
    <button class="qa" onclick="quickSend('What do you remember about me?')">Memory</button>
</div>

<!-- INPUT -->
<div id="bottom">
    <button id="mic" onclick="toggleMic()">
        <svg viewBox="0 0 24 24">
            <rect x="9" y="3" width="6" height="11" rx="3"/>
            <path d="M5 11a7 7 0 0 0 14 0"/>
            <line x1="12" y1="18" x2="12" y2="22"/>
            <line x1="9" y1="22" x2="15" y2="22"/>
        </svg>
    </button>
    <textarea id="input" placeholder="Message Bina..." rows="1" oninput="autoResize(this)"></textarea>
    <button id="send" onclick="send()">
        <svg viewBox="0 0 24 24">
            <line x1="12" y1="19" x2="12" y2="5"/>
            <polyline points="5 12 12 5 19 12"/>
        </svg>
    </button>
</div>

<script>
    // Auto-start — no passphrase needed
    startApp();

    function startApp() {
        startPolling();
        checkPushStatus();
    }

    // ── Push Notifications ─────────────────────────────────────────────────

    async function checkPushStatus() {
        if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
        const permission = Notification.permission;
        if (permission === 'granted') {
            await registerPushSilent();
        } else if (permission === 'default') {
            document.getElementById('notif-prompt').classList.remove('hidden');
        }
    }

    async function enablePush() {
        document.getElementById('notif-prompt').classList.add('hidden');
        const permission = await Notification.requestPermission();
        if (permission === 'granted') {
            await registerPushSilent();
            addMsg('🔔 Push notifications enabled.', 'agent');
        }
    }

    function dismissPrompt() {
        document.getElementById('notif-prompt').classList.add('hidden');
    }

    async function registerPushSilent() {
        try {
            const reg = await navigator.serviceWorker.register('/sw.js');
            await navigator.serviceWorker.ready;
            const keyRes = await fetch('/vapid-public-key');
            const keyData = await keyRes.json();
            let sub = await reg.pushManager.getSubscription();
            if (!sub) {
                sub = await reg.pushManager.subscribe({
                    userVisibleOnly: true,
                    applicationServerKey: urlBase64ToUint8Array(keyData.key)
                });
            }
            await fetch('/subscribe', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                credentials: 'include',
                body: JSON.stringify(sub)
            });
        } catch(e) {
            console.log('Push error:', e.message);
        }
    }

    function urlBase64ToUint8Array(base64String) {
        const padding = '='.repeat((4 - base64String.length % 4) % 4);
        const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
        const rawData = window.atob(base64);
        const outputArray = new Uint8Array(rawData.length);
        for (let i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
        return outputArray;
    }

    // ── Notifications ──────────────────────────────────────────────────────

    let allNotifications = [];

    function startPolling() {
        pollNotifications();
        setInterval(pollNotifications, 30000);
    }

    async function pollNotifications() {
        try {
            const r = await fetch('/notifications', {credentials: 'include'});
            const d = await r.json();
            allNotifications = d.notifications;
            const badge = document.getElementById('notif-badge');
            const btn = document.getElementById('notif-btn');
            if (d.unread_count > 0) {
                badge.textContent = d.unread_count;
                badge.style.display = 'flex';
                btn.classList.add('has-unread');
            } else {
                badge.style.display = 'none';
                btn.classList.remove('has-unread');
            }
        } catch(e) {}
    }

    function openNotifs() {
        document.getElementById('notif-panel').classList.add('open');
        renderNotifs();
        // Mark all as read after a delay
        setTimeout(() => {
            allNotifications.forEach(n => {
                if (!n.read) markRead(n.id);
            });
            pollNotifications();
        }, 1500);
    }

    function closeNotifs() {
        document.getElementById('notif-panel').classList.remove('open');
        pollNotifications();
    }

    function renderNotifs() {
        const list = document.getElementById('notif-list');
        if (allNotifications.length === 0) {
            list.innerHTML = '<div class="notif-empty">No new intelligence</div>';
            return;
        }
        list.innerHTML = allNotifications.map(n => `
            <div class="notif-item ${n.read ? '' : 'unread'}" id="notif-${n.id}">
                <div class="notif-from">${n.from}</div>
                <div class="notif-subject">${n.subject}</div>
                <div class="notif-body">${n.body}</div>
                ${n.draft_reply ? `
                <div class="notif-draft-label">Bina's Draft Reply</div>
                <div class="notif-draft" id="draft-${n.id}" contenteditable="false">${n.draft_reply}</div>
                <div class="notif-actions">
                    <button class="btn-send" onclick="sendDraft('${n.id}', '${escapeAttr(n.from)}', '${escapeAttr(n.subject)}')">Send Reply</button>
                    <button class="btn-edit" onclick="editDraft('${n.id}')">Edit</button>
                    <button class="btn-dismiss" onclick="dismissNotif('${n.id}')">Dismiss</button>
                </div>` : `
                <div class="notif-actions">
                    <button class="btn-dismiss" onclick="dismissNotif('${n.id}')">Dismiss</button>
                </div>`}
            </div>
        `).join('');
    }

    function escapeAttr(str) {
        return (str || '').replace(/'/g, "\\'").replace(/"/g, '&quot;').replace(/\n/g, ' ');
    }

    async function sendDraft(id, from, subject) {
        const draftEl = document.getElementById(`draft-${id}`);
        const body = draftEl.innerText;
        const toMatch = from.match(/<(.+)>/) || [null, from];
        const to = toMatch[1];
        const r = await fetch('/send-draft', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            credentials: 'include',
            body: JSON.stringify({to, subject, body})
        });
        const d = await r.json();
        if (d.success) {
            document.getElementById(`notif-${id}`).style.opacity = '0.3';
            await markRead(id);
            pollNotifications();
        }
    }

    function editDraft(id) {
        const el = document.getElementById(`draft-${id}`);
        el.contentEditable = 'true';
        el.style.outline = '1px solid #00ff88';
        el.focus();
    }

    async function dismissNotif(id) {
        await markRead(id);
        document.getElementById(`notif-${id}`).style.display = 'none';
        pollNotifications();
    }

    async function markRead(id) {
        await fetch(`/notifications/read/${id}`, {method: 'POST', credentials: 'include'});
    }

    // ── Chat ───────────────────────────────────────────────────────────────

    function autoResize(el) {
        el.style.height = 'auto';
        el.style.height = Math.min(el.scrollHeight, 120) + 'px';
    }

    document.getElementById('input').addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    });

    function quickSend(text) {
        document.getElementById('input').value = text;
        if (!text.endsWith(' ')) send();
        else document.getElementById('input').focus();
    }

    function addMsg(text, role) {
        const chat = document.getElementById('chat');
        const div = document.createElement('div');
        div.className = 'msg ' + role;
        if (role === 'agent') {
            div.innerHTML = `<div class="msg-label">Bina</div><div class="msg-bubble">${text.replace(/\n/g, '<br>')}</div>`;
        } else if (role === 'typing') {
            div.className = 'msg agent typing';
            div.innerHTML = `<div class="msg-label">Bina</div><div class="msg-bubble"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
        } else {
            div.innerHTML = `<div class="msg-bubble">${text.replace(/\n/g, '<br>')}</div>`;
        }
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
        return div;
    }

    function addStatus(text, type) {
        const chat = document.getElementById('chat');
        const div = document.createElement('div');
        div.className = 'status-tag ' + type;
        div.textContent = text;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }

    let history = [];

    async function send() {
        const input = document.getElementById('input');
        const msg = input.value.trim();
        if (!msg) return;
        input.value = '';
        input.style.height = 'auto';
        addMsg(msg, 'user');
        const typing = addMsg('', 'typing');

        try {
            const r = await fetch('/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                credentials: 'include',
                body: JSON.stringify({message: msg, history: history})
            });

            if (r.status === 401) {
                typing.className = 'msg agent';
                typing.innerHTML = `<div class="msg-label">Bina</div><div class="msg-bubble">Session expired. Refreshing...</div>`;
                setTimeout(() => location.reload(), 2000);
                return;
            }

            const d = await r.json();
            typing.className = 'msg agent';
            typing.innerHTML = `<div class="msg-label">Bina</div><div class="msg-bubble">${d.response.replace(/\n/g, '<br>')}</div>`;

            if (d.email_sent) addStatus(d.email_sent, 'sent');
            if (d.email_error) addStatus(d.email_error, 'failed');
            if (d.event_created) addStatus(d.event_created, 'event');

            history.push({role: 'user', content: msg});
            history.push({role: 'assistant', content: d.response});
            if (history.length > 20) history = history.slice(-20);

        } catch(e) {
            typing.className = 'msg agent';
            typing.innerHTML = `<div class="msg-label">Bina</div><div class="msg-bubble">Connection error. Try again.</div>`;
        }

        document.getElementById('chat').scrollTop = 99999;
    }

    // ── Voice ──────────────────────────────────────────────────────────────

    let recognition = null;
    function toggleMic() {
        const mic = document.getElementById('mic');
        if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) {
            addMsg('Voice input requires Safari on iPhone.', 'agent');
            return;
        }
        if (recognition) {
            recognition.stop(); recognition = null;
            mic.classList.remove('listening'); return;
        }
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SR();
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.lang = 'en-US';
        recognition.onresult = e => {
            document.getElementById('input').value = e.results[0][0].transcript;
            mic.classList.remove('listening');
            recognition = null;
            send();
        };
        recognition.onerror = () => { mic.classList.remove('listening'); recognition = null; };
        recognition.onend = () => { mic.classList.remove('listening'); recognition = null; };
        recognition.start();
        mic.classList.add('listening');
    }
</script>
</body>
</html>
