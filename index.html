<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bina</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            padding: 40px 0 10px 0;
            text-align: center;
            border-bottom: 1px solid #1a1a1a;
        }

        .hebrew-accent {
            font-size: 11px;
            color: #444;
            letter-spacing: 6px;
            margin-bottom: 10px;
        }

        .logo {
            font-size: 32px;
            font-weight: 300;
            letter-spacing: 8px;
            color: #fff;
        }

        .star {
            font-size: 12px;
            color: #555;
            margin: 0 8px;
        }

        .tagline {
            font-size: 11px;
            color: #444;
            letter-spacing: 4px;
            margin-top: 8px;
            text-transform: uppercase;
        }

        #chat {
            flex: 1;
            width: 100%;
            max-width: 680px;
            overflow-y: auto;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .msg {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 2px;
            font-size: 14px;
            line-height: 1.6;
            letter-spacing: 0.3px;
        }

        .msg.user {
            background: #111;
            border: 1px solid #222;
            align-self: flex-end;
            color: #eee;
        }

        .msg.agent {
            background: #0a0a0a;
            border-left: 1px solid #333;
            align-self: flex-start;
            color: #ccc;
        }

        .msg.agent::before {
            content: "בינה";
            display: block;
            font-size: 9px;
            color: #444;
            letter-spacing: 3px;
            margin-bottom: 6px;
        }

        #bottom {
            width: 100%;
            max-width: 680px;
            padding: 16px 20px 32px 20px;
            display: flex;
            gap: 10px;
            border-top: 1px solid #111;
        }

        #input {
            flex: 1;
            background: #0d0d0d;
            border: 1px solid #1f1f1f;
            color: #fff;
            padding: 12px 16px;
            font-size: 14px;
            outline: none;
            border-radius: 2px;
            font-family: inherit;
            letter-spacing: 0.3px;
        }

        #input::placeholder { color: #333; }
        #input:focus { border-color: #333; }

        #send {
            background: #fff;
            color: #000;
            border: none;
            padding: 12px 24px;
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 2px;
            font-family: inherit;
        }

        #send:hover { background: #e0e0e0; }

        .footer-hebrew {
            font-size: 10px;
            color: #1a1a1a;
            letter-spacing: 4px;
            padding: 8px 0;
        }
    </style>
</head>
<body>
    <header>
        <div class="hebrew-accent">מערכת בינה מלאכותית</div>
        <div class="logo"><span class="star">✡</span>BINA<span class="star">✡
