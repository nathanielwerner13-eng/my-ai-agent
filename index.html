<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alfred</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: sans-serif; background: #1a1a2e; color: #eee; height: 100vh; display: flex; flex-direction: column; }
        #header { background: #16213e; padding: 20px; text-align: center; border-bottom: 1px solid #0f3460; }
        #header h1 { color: #e94560; font-size: 24px; }
        #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .msg { max-width: 80%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; }
        .user { background: #0f3460; align-self: flex-end; }
        .agent { background: #16213e; align-self: flex-start; border-left: 3px solid #e94560; }
        .name { color: #e94560; font-size: 12px; font-weight: bold; margin-bottom: 5px; }
        #bottom { background: #16213e; padding: 20px; border-top: 1px solid #0f3460; display: flex; gap: 10px; }
        #input { flex: 1; background: #1a1a2e; border: 1px solid #0f3460; color: #eee; padding: 12px; border-radius: 8px; font-size: 16px; outline: none; }
        #send { background: #e94560; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-size: 16px; }
    </style>
</head>
<body>
    <div id="header"><h1>Alfred</h1><p>Your Personal AI Agent</p></div>
    <div id="chat">
        <div class="msg agent"><div class="name">ALFRED</div>Good day! I am Alfred, your personal AI agent. How may I assist you today?</div>
    </div>
    <div id="bottom">
        <input type="text" id="input" placeholder="Message Alfred...">
        <button id="send" onclick="send()">Send</button>
    </div>
    <script>
        document.getElementById("input").addEventListener("keypress", function(e) { if(e.key === "Enter") send(); });
        async function send() {
            var msg = document.getElementById("input").value.trim();
            if (!msg) return;
            var chat = document.getElementById("chat");
            chat.innerHTML += "<div class=\"msg user\">" + msg + "</div>";
            document.getElementById("input").value = "";
            chat.innerHTML += "<div class=\"msg agent\" id=\"typing\"><div class=\"name\">ALFRED</div>Thinking...</div>";
            chat.scrollTop = chat.scrollHeight;
            try {
                var r = await fetch("/chat", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({message: msg})});
                var d = await r.json();
                document.getElementById("typing").outerHTML = "<div class=\"msg agent\"><div class=\"name\">ALFRED</div>" + d.response + "</div>";
            } catch(e) {
                document.getElementById("typing").outerHTML = "<div class=\"msg agent\"><div class=\"name\">ALFRED</div>Error - please try again.</div>";
            }
            chat.scrollTop = chat.scrollHeight;
        }
    </script>
</body>
</html>
